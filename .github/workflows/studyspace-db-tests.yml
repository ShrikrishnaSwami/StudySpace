name: StudySpace local database policy tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/studyspace-db-tests.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/studyspace-db-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase stack
        run: supabase start -x studio,inbucket,edge-runtime,logflare,vector
      - name: Apply all migrations and run pgTAP policy tests
        run: supabase test db
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
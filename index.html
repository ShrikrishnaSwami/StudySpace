<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astra Study Tutor</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-alt: #1f2937;
      --primary: #8b5cf6;
      --primary-soft: #a78bfa;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .chatbox {
      width: 100%;
      max-width: 900px;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.28);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, var(--primary), var(--primary-soft));
      padding: 18px 22px;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .messages {
      height: 420px;
      overflow-y: auto;
      padding: 20px;
      background: var(--panel);
    }

    .msg {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
    }

    .msg.user {
      align-items: flex-end;
    }

    .bubble {
      max-width: 75%;
      border-radius: 14px;
      padding: 12px 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .msg.user .bubble {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.bot .bubble {
      background: var(--panel-alt);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .input-row {
      display: flex;
      gap: 12px;
      padding: 18px;
      background: #0b1220;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    input {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      background: #111827;
      color: white;
      outline: none;
    }

    button {
      border: none;
      background: var(--accent);
      color: #06210f;
      font-weight: 700;
      border-radius: 12px;
      padding: 14px 20px;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }

    .status {
      padding: 10px 18px 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="chatbox">
    <div class="header">Astra Study Tutor</div>
    <div class="status" id="status">Ready</div>
    <div class="messages" id="messages">
      <div class="msg bot">
        <div class="bubble">Hi! Ask me anything about a subject, and I’ll help you understand it step by step.</div>
      </div>
    </div>
    <div class="input-row">
      <input id="userInput" type="text" placeholder="Type your question..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('userInput');
    const statusEl = document.getElementById('status');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      inputEl.value = '';
      statusEl.textContent = 'Thinking...';
      sendBtn.disabled = true;

      try {
        const response = await fetch('http://127.0.0.1:5000/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        const reply = data.reply || 'Sorry, I could not get a response.';
        addMessage(reply, 'bot');
        statusEl.textContent = 'Ready';
      } catch (error) {
        addMessage('The tutor is not available right now. Make sure the backend server is running.', 'bot');
        statusEl.textContent = 'Server offline';
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>

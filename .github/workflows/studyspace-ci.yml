name: StudySpace CI and browser smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studyspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-public-key-for-build-only
      GEMINI_API_KEY: placeholder-key-for-build-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Lint application code
        run: npm run lint
      - name: Unit and security regression tests
        run: |
          npm run test:retrieval
          npm run test:syllabus
          npm run test:security
          npm run test:hardening
          npm run test:ai
      - name: Production build and type checks
        run: npm run build
      - name: Install Playwright for browser smoke tests
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and authorization smoke tests
        run: npx playwright test
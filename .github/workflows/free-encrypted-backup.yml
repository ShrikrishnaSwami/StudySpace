name: StudySpace encrypted free backup artifact

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: studyspace-free-backup-artifact
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.BACKUP_SUPABASE_DB_URL }}
      BACKUP_DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
      STORAGE_BUCKETS: assignment-files,assignment-submissions,homework
      AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      AGE_RECIPIENT_RESTORE: ${{ secrets.BACKUP_AGE_RECIPIENT_RESTORE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate required backup configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL BACKUP_DB_PASSWORD AGE_RECIPIENT AGE_RECIPIENT_RESTORE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret for ${name}. See docs/OFFSITE_BACKUP_SETUP.md."
              exit 1
            fi
          done
          [[ "$SUPABASE_URL" == https://* ]] || { echo "::error::SUPABASE_URL must use HTTPS"; exit 1; }
          [[ "$AGE_RECIPIENT" == age1* ]] || { echo "::error::AGE_RECIPIENT must be an age public recipient (age1...)"; exit 1; }
          [[ "$AGE_RECIPIENT_RESTORE" == age1* ]] || { echo "::error::AGE_RECIPIENT_RESTORE must be an age public recipient (age1...)"; exit 1; }

      - name: Record backup start in admin dashboard
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(BACKUP_NOW="$now" python3 -c 'import json,os; print(json.dumps({"id": True, "status": "running", "started_at": os.environ["BACKUP_NOW"], "completed_at": None, "run_id": os.environ["GITHUB_RUN_ID"], "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"], "manifest": {}, "updated_at": os.environ["BACKUP_NOW"]}))' )"
          curl --fail-with-body --silent --show-error --retry 3             "$SUPABASE_URL/rest/v1/system_backup_status?on_conflict=id"             -X POST             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             -H "Prefer: resolution=merge-duplicates,return=minimal"             --data "$payload"
 
      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age postgresql-client python3
          python3 --version
          pg_dump --version
          age --version

      - name: Validate independent recovery identity with an encrypted round trip
        shell: bash
        env:
          AGE_IDENTITY_RESTORE: ${{ secrets.BACKUP_AGE_IDENTITY_RESTORE }}
        run: |
          set -euo pipefail
          if [[ -z "${AGE_IDENTITY_RESTORE:-}" ]]; then
            echo "::error::The independent backup recovery identity is not configured."
            exit 1
          fi
          umask 077
          identity_file="$RUNNER_TEMP/studyspace-recovery.agekey"
          test_dir="$RUNNER_TEMP/studyspace-recovery-test"
          mkdir -p "$test_dir"
          printf '%s' "$AGE_IDENTITY_RESTORE" > "$identity_file"
          unset AGE_IDENTITY_RESTORE
          derived_recipient="$(age-keygen -y "$identity_file")"
          if [[ "$derived_recipient" != "$AGE_RECIPIENT_RESTORE" ]]; then
            echo "::error::The recovery identity does not match the configured recovery recipient."
            exit 1
          fi
          printf 'StudySpace encrypted recovery self-test\n' > "$test_dir/plaintext"
          age --recipient "$AGE_RECIPIENT_RESTORE" --output "$test_dir/payload.age" "$test_dir/plaintext"
          age --decrypt --identity "$identity_file" --output "$test_dir/restored" "$test_dir/payload.age"
          cmp "$test_dir/plaintext" "$test_dir/restored"
          rm -f "$identity_file"
          rm -rf "$test_dir"

      - name: Export PostgreSQL application schema and data
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p backup-work encrypted
          # Direct database URL must target the production project's direct connection.
          # Exclude managed Supabase schemas; public application schema/data and RLS
          # policies are included. Auth user metadata and Storage objects are exported
          # separately by the next step.
          pg_dump --dbname="$SUPABASE_DB_URL" --schema=public --schema=private --format=custom --no-owner --no-privileges --file=backup-work/public-database.dump
          test -s backup-work/public-database.dump
          age --recipient "$AGE_RECIPIENT" --recipient "$AGE_RECIPIENT_RESTORE" --output encrypted/public-database.dump.age backup-work/public-database.dump
          rm -f backup-work/public-database.dump

      - name: Export private Storage objects and Auth metadata
        run: python3 scripts/backup/export_storage.py

      - name: Archive and encrypt Storage objects and Auth metadata
        shell: bash
        run: |
          set -euo pipefail
          tar --create --gzip --file=backup-work/storage-and-auth.tar.gz --directory=backup-work storage auth-users.json export-summary.json
          test -s backup-work/storage-and-auth.tar.gz
          age --recipient "$AGE_RECIPIENT" --recipient "$AGE_RECIPIENT_RESTORE" --output encrypted/storage-and-auth.tar.gz.age backup-work/storage-and-auth.tar.gz
          rm -rf backup-work

      - name: Create integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          files = {}
          for path in sorted(Path("encrypted").glob("*.age")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files[path.name] = {"bytes": path.stat().st_size, "sha256": digest}
          manifest = {
              "product": "StudySpace",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "format_version": 1,
              "encryption": "age",
              "files": files,
              "source_commit": os.getenv("GITHUB_SHA", "unknown"),
              "restore_note": "Auth user metadata excludes passwords/sessions; users may need password reset after recovery.",
          }
          Path("encrypted/manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload encrypted backups to private GitHub Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: studyspace-encrypted-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: encrypted/*
          if-no-files-found: error
          retention-days: 7

      - name: Mark backup successful in admin dashboard
        if: success()
        shell: bash
        env:
          BACKUP_ARTIFACT_NAME: studyspace-encrypted-backup-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BACKUP_NOW="$now" python3 - <<'PY' > backup-status.json
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("encrypted/manifest.json").read_text())
          print(json.dumps({
              "id": True,
              "status": "success",
              "completed_at": os.environ["BACKUP_NOW"],
              "updated_at": os.environ["BACKUP_NOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "manifest": {
                  "format_version": manifest["format_version"],
                  "encryption": manifest["encryption"],
                  "created_at_utc": manifest["created_at_utc"],
                  "source_commit": manifest["source_commit"],
                  "files": manifest["files"],
                  "storage": "private-github-actions-artifact",
                  "artifact_name": os.environ["BACKUP_ARTIFACT_NAME"],
                  "retention_days": 7,
                  "upload_completed": True
              }
          }))
          PY
          curl --fail-with-body --silent --show-error --retry 3             "$SUPABASE_URL/rest/v1/system_backup_status?on_conflict=id"             -X POST             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             -H "Prefer: resolution=merge-duplicates,return=minimal"             --data-binary @backup-status.json

      - name: Mark backup failed in admin dashboard
        if: failure() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        shell: bash
        continue-on-error: true
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(BACKUP_NOW="$now" python3 -c 'import json,os; print(json.dumps({"id": True, "status": "failed", "completed_at": os.environ["BACKUP_NOW"], "updated_at": os.environ["BACKUP_NOW"], "run_id": os.environ["GITHUB_RUN_ID"], "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"], "manifest": {"error": "Backup workflow failed; inspect restricted Actions logs."}}))' )"
          curl --fail-with-body --silent --show-error --retry 2             "$SUPABASE_URL/rest/v1/system_backup_status?on_conflict=id"             -X POST             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             -H "Prefer: resolution=merge-duplicates,return=minimal"             --data "$payload"
 
      - name: Remove local backup material
        if: always()
        run: rm -rf backup-work encrypted backup-status.json

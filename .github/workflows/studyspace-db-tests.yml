name: StudySpace security policy regression tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "tests/security-migrations.test.mjs"
      - ".github/workflows/studyspace-db-tests.yml"
      - "package.json"
  pull_request:
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "tests/security-migrations.test.mjs"
      - ".github/workflows/studyspace-db-tests.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studyspace-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify RLS, admin MFA, submission integrity, and model-routing invariants
        run: npm run test:security

# Full pgTAP integration tests remain in supabase/tests/database. They require a
# complete baseline migration for the pre-existing production schema; currently
# the earliest repository migration references public.courses before it exists.
name: Security dependency refresh

on:
  push:
    branches:
      - security/dependency-upgrade

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-upgrade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update Next.js to a patched release
        run: npm install --save-exact next@16.4.3 eslint-config-next@16.4.3
      - name: Apply compatible security patches
        run: npm audit fix
      - name: Confirm no high or critical dependency advisories remain
        run: npm audit --audit-level=high
      - name: Commit updated dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git commit -m "fix: patch vulnerable dependencies [skip ci]"
          git push origin security/dependency-upgrade

name: StudySpace feature branch validation

on:
  push:
    branches: [feature/studyspace-learning-suite-oct28]

permissions:
  contents: read

concurrency:
  group: studyspace-feature-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      GEMINI_API_KEY: ci-placeholder-gemini-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:retrieval
      - run: npx tsc --noEmit
      - run: npm run build
